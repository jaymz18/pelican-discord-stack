# Lokale Entwicklungsumgebung – simuliert Pelican (gleiches Image, gleicher STARTUP-Mechanismus).
#   docker compose up --build    -> MariaDB + Website (http://localhost:3000)
# Bot zusätzlich starten: .env im Projektroot mit DISCORD_TOKEN=... und ENABLE_BOT=1 anlegen.
services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: discord
      MARIADB_USER: discord
      MARIADB_PASSWORD: discord
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  stack:
    build: ./docker
    depends_on:
      mariadb:
        condition: service_healthy
    env_file:
      - path: ./.env
        required: false
    environment:
      STARTUP: "start-stack"
      ENABLE_BOT: "${ENABLE_BOT:-0}"
      ENABLE_WEBSITE: "1"
      SERVER_PORT: "3000"
      SITE_TITLE: Discord Bot Dashboard (Dev)
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: discord
      DB_USERNAME: discord
      DB_PASSWORD: discord
    ports:
      - "3000:3000"
    volumes:
      - ./bot:/home/container/bot
      - ./website:/home/container/website

volumes:
  db-data:
